[project]
name = "grail-compat"
version = "0.1.0"
description = "Pure-Python implementation of the Project Grail API for existing CPython versions"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "grail"
