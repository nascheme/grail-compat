[project]
name = "grail-compat"
version = "0.1.0"
description = "Implementation of the Project Grail API for existing CPython versions"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "pytest",
    "zensical>=0.0.67",
]

[build-system]
requires = ["meson-python>=0.18", "meson>=1.6"]
build-backend = "mesonpy"
